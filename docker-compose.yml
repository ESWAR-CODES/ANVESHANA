# Docker Compose for Anveshana Club Web Platform
# Supports full local staging or single-server VPS containerized deployment

services:
  # ==========================================
  # Node.js + Express Backend API
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: anveshana-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:80,http://localhost:5173}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/anveshana_prod}
      - JWT_SECRET=${JWT_SECRET:-change_this_to_a_secure_random_64_char_key}
      - JWT_EXPIRES_IN=2h
      - COOKIE_SAME_SITE=${COOKIE_SAME_SITE:-lax}
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      - ADMIN_DEFAULT_EMAIL=${ADMIN_DEFAULT_EMAIL:-admin@anveshana-mbu.in}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - anveshana-network

  # ==========================================
  # React + Vite Static Frontend (Nginx)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    container_name: anveshana-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - anveshana-network

  # ==========================================
  # Optional Local MongoDB Service
  # (Can be omitted if connecting to MongoDB Atlas)
  # ==========================================
  mongo:
    image: mongo:7-jammy
    container_name: anveshana-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - anveshana-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  anveshana-network:
    driver: bridge

volumes:
  mongo-data:
